<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0f19" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#grad)" stroke-width="2" />
  <!-- Speed lines -->
  <line x1="12" y1="20" x2="22" y2="20" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="8" y1="28" x2="18" y2="28" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="10" y1="36" x2="16" y2="36" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Racing Car / Lightning Bolt -->
  <path d="M26 14 L46 28 L36 34 L52 50 L28 38 L36 32 Z" fill="url(#grad)" filter="url(#glow)"/>
</svg>